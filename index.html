<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>臺灣政治人物關係圖譜｜六度空間</title>
<style>
:root{--bg:#071321;--panel:#11243b;--panel2:#173451;--line:#34516b;--text:#edf4ff;--muted:#b4c5da;--accent:#9ed6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.58 system-ui,-apple-system,"Noto Sans TC",sans-serif}
a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit;color:var(--text)}button{cursor:pointer}
.wrap{max-width:1550px;padding:17px;margin:auto}
.hero{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;align-items:end}
h1{font-size:clamp(22px,3vw,35px);margin:3px 0 4px;line-height:1.2}h2{font-size:18px;margin:0 0 12px}h3{margin:0 0 8px;font-size:16px}
.subtitle{margin:5px 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.stats span{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:9px;font-size:13px}
.panel{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:15px;margin:12px 0}
.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#1b3b59;padding:9px 13px;border:1px solid #53799a;border-radius:9px;text-decoration:none;font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
button,.toolbar input,.toolbar select,.route select{background:var(--panel2);border:1px solid #527391;border-radius:10px;padding:9px 12px;min-height:43px}
button:hover{background:#285576}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8dc8ff}
.toolbar input{width:min(320px,100%);flex:1 1 170px}
.toolbar button.small{font-weight:700;min-width:43px;font-size:18px}
#scale{font-variant-numeric:tabular-nums;min-width:51px;text-align:center;color:#d9e7f6}
#graphwrap{height:min(69vh,740px);min-height:340px;border:1px solid #37536d;border-radius:11px;overflow:hidden;background:radial-gradient(ellipse at 60% 50%,#142b46 0%,#081829 78%);touch-action:none;overscroll-behavior:contain;position:relative}
#graph{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#graph .node{cursor:pointer}#graph .node circle{stroke:#b9d4f5;stroke-width:1.5}#graph .node text{pointer-events:all;cursor:pointer;paint-order:stroke;stroke:#081629;stroke-width:3.5;stroke-linejoin:round}
#graph .node:hover circle{stroke:white;stroke-width:3}#graph .node .hitbox{fill:transparent;pointer-events:all}#graph .node:focus circle{stroke:#fff;stroke-width:3}
.info{display:grid;grid-template-columns:minmax(250px,1.25fr) minmax(260px,1fr);gap:12px;margin-top:12px}
.record{background:#0b1b2d;padding:10px;border-radius:9px;border:1px solid #314c6b;margin:9px 0}
.record b{display:inline-block;margin-right:7px}.record .type{font-size:11px;color:#d0dded}
.record small,.muted{color:var(--muted)}.record p{margin:5px 0;font-size:13px}
.notes{font-size:13px;color:#d0dded;padding-left:16px;margin:6px 0}
#records{max-height:410px;overflow:auto;padding-right:5px}
.colors{display:flex;gap:10px 17px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:9px}
.key{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:100%}
.route{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:10px}
.route label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.route select{width:100%}
.route-options{margin:9px 0;color:var(--muted);font-size:13px}
.pathstep{border-left:3px solid #87bfea;padding:8px 12px;background:#102c45;border-radius:0 8px 8px 0;margin:7px 0;font-size:13px}
.footer{font-size:12px;color:var(--muted);padding:12px 0 30px}
.loading{color:var(--muted);padding:12px}
.person-modal[hidden]{display:none!important}
.person-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:end;justify-content:center;background:#0009;padding:12px}
.person-modal>.sheet{background:#11243b;color:#edf4ff;border:1px solid #7396b4;border-radius:18px 18px 14px 14px;box-shadow:0 0 50px #0009;width:min(680px,100%);max-height:min(82dvh,800px);display:flex;flex-direction:column;overflow:hidden}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;background:#193753;border-bottom:1px solid #42627d}
.sheethead strong{font-size:19px}.sheethead button{min-height:42px;padding:7px 16px}
.sheetbody{overflow:auto;padding:16px;overscroll-behavior:contain}
.sheetbody .record{margin:9px 0}.sheetbody h3{margin:18px 0 9px}.sheetbody p{margin:6px 0}.sheetbody .record{line-height:1.58}
.modal-open{overflow:hidden}
#graph .node{text-rendering:geometricPrecision}
@media(min-width:900px){.person-modal{align-items:center}.person-modal>.sheet{border-radius:18px;max-height:82vh}}
@media(max-width:740px){.wrap{padding:10px}.panel{padding:11px}.info{grid-template-columns:1fr}.route{grid-template-columns:1fr 1fr}.route button{grid-column:1/-1}#graphwrap{height:56vh;min-height:360px}.toolbar{gap:6px}.toolbar button.small{min-width:42px}.stats span{padding:6px 9px}}
</style>
</head>
<body><div class="wrap">
<header class="hero">
<div><h1>臺灣政治人物關係圖譜</h1><p class="subtitle">跨政黨、跨世代的公開政治關係 · 六度空間實驗</p></div>
<div class="nav"><a href="#route">六度關係查詢</a><a href="#graphwrap" id="wuzheng">最新加入：吳崢</a><a href="#graphwrap" id="wang">王鴻薇</a><a href="./legacy.html">早期分類圖</a><a href="https://github.com/eva20011023-stack/taiwan-political-network">GitHub 專案</a></div>
</header>
<div id="stats" class="stats"><span>資料載入中…</span></div>
<section class="panel">
<div class="toolbar">
<input id="personsearch" list="people" placeholder="搜尋人物，例如：吳崢、王鴻薇、張榮味" aria-label="搜尋人物"><datalist id="people"></datalist>
<button id="searchbtn">尋找人物</button>
<button id="showall">顯示全部</button>
<button class="small" id="zoomout" aria-label="縮小">－</button><span id="scale">100%</span><button class="small" id="zoomin" aria-label="放大">＋</button><button id="fit">重設</button>
</div>
<div id="graphwrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="政治人物關係網絡圖，點選人物查看紀錄" viewBox="-1280 -900 2560 1800">
<text x="-1100" y="0" fill="#b4c5da">正在載入關係圖…</text></svg></div>
<div class="colors" id="legend"></div>
<p class="subtitle">單指拖曳移動、雙指縮放，或使用＋／－按鈕。點一下人物可查看其公開關係；選取後只會強調相連的紀錄，不會推論私人交情。</p>
</section>
<div class="info">
<section class="panel" id="profile"><h2>人物資訊</h2><div id="personinfo" class="loading">點擊關係圖中的人物，查看相關紀錄與來源。</div></section>
<section class="panel"><h2>相關連線與來源</h2><div id="records" class="loading">請先選取人物。</div></section>
</div>
<section class="panel" id="route"><h2>兩個人物之間，隔了幾步？</h2>
<div class="route"><div><label for="routeA">起點人物</label><select id="routeA"></select></div><div><label for="routeB">終點人物</label><select id="routeB"></select></div><button id="routebtn">查詢最短連線</button></div>
<div class="route-options"><label><input type="checkbox" id="includehubs"> 允許透過共同事件／組織間接連接（結果會更短，但不代表人物彼此熟識）</label></div>
<div id="pathresult" class="subtitle">在上方選擇兩位人物開始。</div>
</section>
<div class="person-modal" id="person-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
 <div class="sheet"><div class="sheethead"><strong id="sheet-title">人物資料</strong><button type="button" id="sheet-close" aria-label="關閉人物資料">關閉 ✕</button></div><div class="sheetbody" id="sheet-body"></div></div>
</div>
<footer class="footer">來源：<a href="https://zh.wikipedia.org/wiki/新黨">新黨</a>、<a href="https://zh.wikipedia.org/wiki/張榮味">張榮味</a>、<a href="https://zh.wikipedia.org/wiki/王鴻薇">王鴻薇</a>、<a href="https://zh.wikipedia.org/wiki/吳崢">吳崢</a>（擷取與整理：2026-10-17）。本圖是維基百科內容的初步結構化記錄，不代表資料已全面核實，也不應將同場活動視為私交或同盟。</footer>
</div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),svg=$("graph"),ns="http://www.w3.org/2000/svg";
let db, people=[], graphNodes=[], edges=[], positions=new Map(), selected=null,routeSet=null,focus=false;
let view={x:-1280,y:-900,w:2560,h:1800},ptrs=new Map(),gestureMoved=false,wasDragged=false;
let touchStart=null,lastTouchSelection={id:null,at:0};
const groups={"founder":["創黨","#de9db0",-770,-485],"historical":["歷史人物","#9baec8",-320,-555],"current":["政治人物","#81baff",390,-540],"yunlin":["雲林政治","#d9aa76",775,55],"family":["親屬","#e6aad8",780,580],"external":["其他人物","#93c9b4",0,550],"hub":["事件／組織","#ffd17b",-400,300]};
const types={affiliation:"#7f9dbf",event:"#7a8ca5",family:"#da9bea",contest:"#efb86c",dispute:"#ec8997",cooperate:"#92d6ab",support:"#b4b0ea",case:"#b98dd8"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=(tag,attr={},text)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attr))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const group=n=>groups[n.group]||["人物","#c4cdda",0,0];
function layout(){
 const buckets=new Map();
 for(const n of db.nodes){const g=n.group in groups?n.group:"external";if(!buckets.has(g))buckets.set(g,[]);buckets.get(g).push(n)}
 for(const [g,items] of buckets){const [_name,_color,cx,cy]=groups[g];items.sort((a,b)=>a.label.localeCompare(b.label,"zh-Hant"));items.forEach((n,i)=>{const theta=i*2.399963229728653;const r=Math.sqrt(i+0.3)*63;positions.set(n.id,{x:cx+r*Math.cos(theta),y:cy+r*Math.sin(theta)})})}
}
function viewSet(){svg.setAttribute("viewBox",[view.x,view.y,view.w,view.h].join(" "));$("scale").textContent=Math.round(2560/view.w*100)+"%";}
function worldPoint(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;const matrix=svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:view.x+view.w/2,y:view.y+view.h/2}}
function zoom(f,cx,cy){const rect=svg.getBoundingClientRect();const anchor=worldPoint(cx??rect.left+rect.width/2,cy??rect.top+rect.height/2);const newW=clamp(view.w*f,120,6000),ratio=newW/view.w;view.x=anchor.x-(anchor.x-view.x)*ratio;view.y=anchor.y-(anchor.y-view.y)*ratio;view.w=newW;view.h*=ratio;viewSet();}
function center(n){const p=positions.get(n.id);if(!p)return;view.w=clamp(850,120,6000);view.h=view.w*1800/2560;view.x=p.x-view.w/2;view.y=p.y-view.h/2;viewSet();}
function reset(){view={x:-1280,y:-900,w:2560,h:1800};viewSet()}
function render(){
 svg.replaceChildren();
 const bg=el("g",{id:"links"}),fg=el("g",{id:"nodes"});svg.append(bg,fg);
 edges=db.edges.map((e,i)=>{const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)return null;const l=el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:types[e.type]||"#8395ae","stroke-width":2.3,"stroke-opacity":0.21});bg.append(l);return {el:l,e,i}});
 graphNodes=db.nodes.map(n=>{const p=positions.get(n.id),isHub=n.group==="hub",g=el("g",{"class":"node","data-id":n.id,transform:"translate("+p.x+" "+p.y+")"});
 g.append(el("circle",{r:isHub?10:8,fill:group(n)[1]}));
 g.append(el("rect",{"class":"hitbox",x:-15,y:-19,width:Math.max(70,16*[...n.label].length+43),height:38,rx:8}));
 const text=el("text",{x:14,y:4,"font-size":isHub?12.5:14.5,fill:"#e9f2ff"},n.label);g.append(text);
 g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label","查看 "+n.label+" 的人物關係");
 g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();select(n.id,true)}});

 g.addEventListener("click",e=>{e.stopPropagation();if(wasDragged)return;if(lastTouchSelection.id===n.id&&Date.now()-lastTouchSelection.at<800)return;select(n.id,true)});
 fg.append(g);return {el:g,n}});
 svg.addEventListener("click",()=>{});
 updateHighlight();
}
function updateHighlight(){
 const allowed=new Set(), lineIndices=new Set();
 if(routeSet){for(const id of routeSet.nodes)allowed.add(id);for(const i of routeSet.edges)lineIndices.add(i)}
 else if(selected){allowed.add(selected);for(let i=0;i<db.edges.length;i++){const e=db.edges[i];if(e.from===selected||e.to===selected){allowed.add(e.from);allowed.add(e.to);lineIndices.add(i)}}}
 for(const o of edges){if(!o)continue;const b=routeSet||selected?lineIndices.has(o.i):true;o.el.setAttribute("stroke-opacity",b?(routeSet?0.9:0.79):0.025);o.el.setAttribute("stroke-width",b?(routeSet?4.3:3.0):1.0);}
 for(const o of graphNodes){let active=routeSet?allowed.has(o.n.id):selected?allowed.has(o.n.id):true;o.el.setAttribute("opacity",active?"1":"0.075");const t=o.el.querySelector("text");t.setAttribute("font-weight",selected===o.n.id||routeSet&&allowed.has(o.n.id)?"700":"400")}
}
function select(id,zoomTo=false){
 const n=db.nodes.find(n=>n.id===id);if(!n)return;
 selected=id;routeSet=null;updateHighlight();
 if(zoomTo)center(n);
 $("personsearch").value=n.label;
 const related=db.edges.map((e,i)=>({...e,i})).filter(e=>e.from===id||e.to===id);
 const nn=related.map(e=>({...e,other:e.from===id?e.to:e.from}));const nonhubs=nn.filter(e=>db.nodes.find(n=>n.id===e.other)?.group!=="hub");
 $("personinfo").innerHTML="<h3>"+esc(n.label)+"</h3><p class='muted'>"+esc(group(n)[0])+" · "+nonhubs.length+" 筆直接人物連線 · "+nn.length+" 筆相關紀錄（含事件／組織）</p>"+(n.notes?.length?"<ul class='notes'>"+n.notes.map(s=>"<li>"+esc(s)+"</li>").join("")+"</ul>":"")+"<button id='showperson'>只強調此人的關係</button> <button id='allagain'>恢復整張網絡</button>";
 $("showperson").onclick=()=>{updateHighlight();center(n)};$("allagain").onclick=showAll;
 $("records").innerHTML=nn.length?nn.slice(0,100).map(e=>"<div class='record'><b>"+esc(e.other)+"</b><span class='type'>"+esc(e.type)+" · "+esc(e.period)+"</span><p>"+esc(e.detail)+"</p>"+(e.url?"<a href='"+esc(e.url)+"' target='_blank' rel='noopener'>資料來源 ↗</a>":"")+"</div>").join(""):"<p>尚無資料庫內的直接關係紀錄。</p>";
 openPersonSheet(n,nn);
}
function openPersonSheet(n,related){
 $("sheet-title").textContent=n.label+"｜人物關係";
 const note=(n.notes?.length?"<ul class='notes'>"+n.notes.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"");
 const cards=related.length?related.slice(0,100).map(e=>{
 const other=e.from===n.id?e.to:e.from;
 return "<div class='record'><b>"+esc(other)+"</b><span class='type'>"+esc(e.type)+" · "+esc(e.period)+"</span><p>"+esc(e.detail)+"</p>"+(e.url?"<a href='"+esc(e.url)+"' target='_blank' rel='noopener noreferrer'>查看來源 ↗</a>":"")+"</div>";
 }).join(""):"<p>目前還沒有可顯示的關係紀錄。</p>";
 $("sheet-body").innerHTML="<p class='muted'>"+esc(group(n)[0])+" · "+related.length+" 筆公開關係紀錄（包含共同事件）</p>"+note+"<h3>關係紀錄</h3>"+cards;
 $("person-modal").hidden=false;document.body.classList.add("modal-open");
 $("sheet-body").scrollTop=0;
 }
 function closePersonSheet(){$("person-modal").hidden=true;document.body.classList.remove("modal-open")}
 $("sheet-close").onclick=closePersonSheet;
 $("person-modal").addEventListener("click",e=>{if(e.target===$("person-modal"))closePersonSheet()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("person-modal").hidden)closePersonSheet()});
function showAll(){selected=null;routeSet=null;$("personsearch").value="";updateHighlight();reset();$("personinfo").innerHTML="點選人物，即可閱讀其工作、選舉、公開爭論或共同活動紀錄。";$("records").textContent="請先選取人物。";}
function findPerson(){const q=$("personsearch").value.trim();const n=people.find(n=>n.label===q)||people.find(n=>n.label.includes(q));if(n&&q)select(n.id,true);else if(q)$("personinfo").textContent="找不到這個人物，請試試其他姓名。"}
function path(){
 const a=$("routeA").value,b=$("routeB").value,withHub=$("includehubs").checked;
 const nodeMap=new Map(db.nodes.map(n=>[n.id,n]));const adj=new Map(db.nodes.map(n=>[n.id,[]]));
 db.edges.forEach((e,i)=>{const hub=nodeMap.get(e.from)?.group==="hub"||nodeMap.get(e.to)?.group==="hub";if(hub&&!withHub)return;if(e.type==="case")return;adj.get(e.from)?.push([e.to,i]);adj.get(e.to)?.push([e.from,i])});
 const q=[a],seen=new Set(q),parent=new Map();
 for(let i=0;i<q.length;i++){const id=q[i];if(id===b)break;for(const [n,ei] of adj.get(id)||[])if(!seen.has(n)){seen.add(n);parent.set(n,[id,ei]);q.push(n)}}
 if(!seen.has(b)){$("pathresult").textContent="目前資料庫找不到這兩位人物之間的連線。可以開啟「共同事件／組織」再試一次。";routeSet=null;updateHighlight();return}
 const rev=[],nodes=[b],ris=[];let cursor=b;while(cursor!==a){const [p,ei]=parent.get(cursor);rev.unshift([p,cursor,ei]);ris.push(ei);nodes.push(p);cursor=p}routeSet={nodes,edges:ris};selected=null;updateHighlight();
 $("pathresult").innerHTML="<h3>"+rev.length+" 步紀錄連線</h3>"+(rev.length===0?"起點與終點相同。":rev.map(([x,y,i])=>{const e=db.edges[i];return "<div class='pathstep'><b>"+esc(x)+" → "+esc(y)+"</b><p>"+esc(e.detail)+"（"+esc(e.period)+"）</p>"+(e.url?"<a href='"+esc(e.url)+"' target='_blank' rel='noopener'>查閱來源 ↗</a>":"")+"</div>"}).join(""))+"<p class='subtitle'>此處計算的是所蒐集紀錄的最短路徑，不是人際親疏或私人往來。</p>";
 const endpoints=rev.flatMap(([x,y])=>[positions.get(x),positions.get(y)]);if(endpoints.length){const xs=endpoints.map(p=>p.x),ys=endpoints.map(p=>p.y);const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);view.w=clamp(Math.max(maxX-minX+450,(maxY-minY+320)*2560/1800),500,5100);view.h=view.w*1800/2560;view.x=(minX+maxX-view.w)/2;view.y=(minY+maxY-view.h)/2;viewSet();}
}
function boot(data){
 db=data;people=db.nodes.filter(n=>n.group!=="hub").sort((a,b)=>a.label.localeCompare(b.label,"zh-Hant"));
 $("stats").innerHTML="<span>"+people.length+" 位人物</span><span>"+(db.nodes.length-people.length)+" 個組織／事件節點</span><span>"+db.edges.length+" 筆連線紀錄</span><span>"+db.meta.sources.length+" 篇維基條目</span>";
 $("people").innerHTML=people.map(n=>"<option value='"+esc(n.label)+"'></option>").join("");
 for(const k of ["routeA","routeB"])$(k).innerHTML=people.map(n=>"<option value='"+esc(n.id)+"'>"+esc(n.label)+"</option>").join("");
 $("routeA").value="吳崢";$("routeB").value="張榮味";
 $("legend").innerHTML=Object.values(groups).map(([name,color])=>"<span class='key'><span class='dot' style='background:"+color+"'></span>"+name+"</span>").join("");
 layout();render();viewSet();showAll();
}
$("wuzheng").onclick=()=>{if(db)select("吳崢",true)};$("wang").onclick=()=>{if(db)select("王鴻薇",true)};$("searchbtn").onclick=findPerson;$("personsearch").addEventListener("keydown",e=>{if(e.key==="Enter")findPerson()});
$("showall").onclick=showAll;$("zoomin").onclick=()=>zoom(0.69);$("zoomout").onclick=()=>zoom(1.45);$("fit").onclick=reset;$("routebtn").onclick=path;
svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?0.82:1.22,e.clientX,e.clientY)},{passive:false});
const pinch=()=>{const a=[...ptrs.values()];if(a.length<2)return null;return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
let prevPinch=null;
svg.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse"&&e.button!==0)return;
 const p={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,p);
 if(ptrs.size===1){wasDragged=false;gestureMoved=false;touchStart={id:e.pointerId,begin:p,target:e.target.closest?.(".node")?.dataset.id||null};}
 else {wasDragged=true;gestureMoved=true;touchStart=null;}
 prevPinch=pinch();
});
svg.addEventListener("pointermove",e=>{
 const old=ptrs.get(e.pointerId);if(!old)return;
 const p={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,p);
 if(ptrs.size>=2){const now=pinch();if(prevPinch&&now&&now.d>0&&prevPinch.d>0){
 zoom(prevPinch.d/now.d,now.x,now.y);const r=svg.getBoundingClientRect();view.x-=(now.x-prevPinch.x)/r.width*view.w;view.y-=(now.y-prevPinch.y)/r.height*view.h;viewSet();
 }prevPinch=now;wasDragged=true;e.preventDefault();}
 else {
  const d=touchStart?Math.hypot(p.x-touchStart.begin.x,p.y-touchStart.begin.y):0;
  if(!wasDragged&&d<11)return;
  wasDragged=true;
  const dx=p.x-old.x,dy=p.y-old.y;
  if(dx||dy){const r=svg.getBoundingClientRect();view.x-=dx/r.width*view.w;view.y-=dy/r.height*view.h;viewSet();e.preventDefault()}
 }
});
const end=e=>{
 const wasSingle=ptrs.size===1,ts=touchStart;
 ptrs.delete(e.pointerId);prevPinch=pinch();
 if(e.type==="pointerup"&&e.pointerType==="touch"&&wasSingle&&!wasDragged&&ts&&ts.id===e.pointerId&&ts.target){
  lastTouchSelection={id:ts.target,at:Date.now()};
  e.preventDefault();e.stopPropagation();select(ts.target,true);
 }
 if(!ptrs.size){touchStart=null;setTimeout(()=>{wasDragged=false},100);}
};
svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
svg.addEventListener("dblclick",e=>{e.preventDefault();zoom(0.7,e.clientX,e.clientY)});
fetch("./data/network.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(boot).catch(e=>{svg.replaceChildren(el("text",{x:-900,y:0,fill:"#e9f2ff","font-size":30},"無法載入資料："+e.message));$("stats").textContent="資料載入失敗，請重新整理頁面。"});
})();
