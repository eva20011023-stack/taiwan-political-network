<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政治六度關係查詢</title><style>body{margin:0;background:#091426;color:#edf5ff;font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.65}.wrap{max-width:850px;margin:auto;padding:22px}a{color:#9cd8ff}select,button{font:inherit;color:#fff;background:#192d48;border:1px solid #56708c;padding:12px;border-radius:10px;max-width:100%;box-sizing:border-box}select{width:100%}button{margin:12px 0;cursor:pointer;background:#326b97}.panel{background:#14243a;padding:18px;border-radius:15px;margin:14px 0}.path{border-left:3px solid #88bbee;padding:9px 15px;margin:10px 0;background:#1a2e48}small{color:#bac8da}label{display:block;margin:10px 0 4px}</style></head><body><div class="wrap"><p><a href="./">← 返回完整人物關係圖</a></p><h1>政治人物六度關係查詢</h1><p>選擇兩人，查看目前資料庫的最短紀錄路徑。這是公開政治關係圖譜，並不表示私人交情或六度分隔理論的實證。</p><div class="panel"><label for="a">起點人物</label><select id="a"></select><label for="b">終點人物</label><select id="b"></select><label><input type="checkbox" id="hubs"> 允許經過共同事件／組織節點（間接關聯）</label><button id="go">查詢最短路徑</button><div id="out" aria-live="polite"></div></div><p><small>資料以維基百科條目初步整理；每筆紀錄顯示其來源與時段。案件共現不等於彼此有關係，預設排除司法事件節點。</small></p></div><script>
const $=id=>document.getElementById(id);let db;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
fetch("./data/network.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{db=data;let people=data.nodes.filter(n=>n.group!=="hub").sort((a,b)=>a.label.localeCompare(b.label,"zh-Hant"));for(let id of ["a","b"])$(id).innerHTML=people.map(n=>'<option value="'+esc(n.id)+'">'+esc(n.label)+'</option>').join("");$("a").value=people.find(n=>n.label==="張嘉郡")?.id||people[0].id;$("b").value=people.find(n=>n.label==="宋楚瑜")?.id||people[1].id;$("go").click()}).catch(e=>$("out").textContent="資料載入失敗："+e.message);
$("go").onclick=()=>{if(!db)return;let A=$("a").value,B=$("b").value,allow=$("hubs").checked;let ids=new Map(db.nodes.map(n=>[n.id,n])),adj=new Map;for(let n of db.nodes)adj.set(n.id,[]);for(let e of db.edges){if(!allow&&(ids.get(e.from)?.group==="hub"||ids.get(e.to)?.group==="hub"))continue;if(allow&&(/司法|弊案|犯罪|賄選/.test(e.from+" "+e.to)))continue;adj.get(e.from)?.push([e.to,e]);adj.get(e.to)?.push([e.from,e]);}
let q=[A],seen=new Set(q),parents=new Map;for(let i=0;i<q.length;i++){let v=q[i];if(v===B)break;for(let [w,e] of adj.get(v)||[])if(!seen.has(w)){seen.add(w);parents.set(w,[v,e]);q.push(w)}}
if(!seen.has(B)){$("out").innerHTML="<p>此範圍內找不到路徑。可嘗試允許經過共同事件／組織節點。</p>";return}
let path=[],v=B;while(v!==A){let [p,e]=parents.get(v);path.unshift([p,v,e]);v=p}
let h="<h2>"+path.length+" 步連線</h2>";if(!path.length)h+="<p>起點與終點相同。</p>";for(let [u,v,e] of path){h+='<div class="path"><strong>'+esc(ids.get(u)?.label||u)+' → '+esc(ids.get(v)?.label||v)+'</strong><p>'+esc(e.detail||e.type||"紀錄")+'</p><small>'+esc(e.period||"未註明時段")+' · '+esc(e.type||"")+'</small>'+(e.url?'<p><a target="_blank" rel="noopener" href="'+esc(e.url)+'">查看條目依據 ↗</a></p>':"")+'</div>'}$("out").innerHTML=h};
</script></body></html>
